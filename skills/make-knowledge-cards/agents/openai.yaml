name: make-knowledge-cards
description: 把用户粘贴的文章正文或本地 Markdown/TXT 文件转换为 5-8 张知识卡片。每张卡片含标题、核心知识、简明解释、例子或自测问题。当用户说"把这段/这篇文章做成知识卡片、转成卡片、提炼成知识点卡片、做知识整理卡片"，或粘贴长文、上传本地 .md/.txt 文件并要求生成学习卡片时使用。不做网页抓取、PDF 解析、Anki 导出或图形界面。
instructions: |
  把用户提供的文章内容（粘贴文本或本地 .md/.txt 文件）提炼成每张只讲一个知识点的学习卡片。纯文本输入、文本输出。

  输出格式：固定 5-8 张卡片，每张结构为：
  ### 卡片 N｜<标题>
  - 核心知识：<一句话讲清这个知识点>
  - 简明解释：<3-5 句展开说明，覆盖是什么 / 为什么 / 怎么用>
  - 例子或自测问题：<一个具体例子，或一个能检验是否掌握的自测问题>

  生成流程：
  1. 先完整读取全文，理解主题与结构。
  2. 列出候选知识点：识别真正重要的概念、原理、方法、结论、因果或步骤。
  3. 拆点：一个知识点对应一张卡片，禁止一张卡塞多个点。
  4. 去重：删除重复出现或语义重叠的表述，合并进同一张卡片。
  5. 定稿：为每个知识点写标题与四要素，控制在 5-8 张。

  质量硬规则：
  - 只提炼真正重要的知识；略去背景铺垫、修辞、举例堆砌和过渡句。
  - 一张卡只讲一个知识点。
  - 不编造原文没有的信息；卡片内容必须严格源自原文，不补充外部知识或个人推断。
  - 信息不足时不强行凑数：知识点不足 5 个就按实际数量输出；超过 8 个则合并次要、保留最重要的 8 个。绝不拆分注水或编造。
  - 数字、专有名词、结论表述与原文一致。
  - 语言与原文一致（中文原文用中文，英文原文用英文）。

  卡片要素写作要点：
  - 标题：简洁具体的名词短语或短语。
  - 核心知识：一句话点明本质，本卡最浓缩的一句。
  - 简明解释：3-5 句，按"是什么 → 为什么重要/如何运作 → 典型用法"展开，只讲本卡知识点。
  - 例子或自测问题：二选一。优先用原文具体例子；原文无例子时可写一个能检验掌握程度的自测问句。

  不支持的输入：网页抓取（不访问 URL）、PDF 等非 md/txt 文件、Anki 导出、图形界面。遇到时直接说明不受支持，提示先手动把内容转成文本或 .md/.txt。
